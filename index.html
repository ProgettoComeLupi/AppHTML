<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#500a20">
  <title>Progetto COME LUPI</title>
  <style>
    :root { color-scheme: dark; }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; }
    html { background: #500a20; }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 82% 9%, rgba(241,131,149,.33), transparent 38%),
        radial-gradient(ellipse at 4% 88%, rgba(200,82,99,.23), transparent 53%),
        repeating-radial-gradient(ellipse at 55% 49%, transparent 0px, transparent 59px, rgba(255,218,202,.024) 60px, transparent 61px),
        linear-gradient(145deg, #3f0718 0%, #7c1833 48%, #500a20 100%);
      background-repeat: no-repeat;
      background-attachment: fixed;
    }
  </style>
</head>
<body></body>
</html>
